[platformio]
; gateway and node build the current version (newest folder under firmware/).
default_envs = gateway, node

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; scripts/fw_version.py turns custom_fw_version into FW_VERSION and copies each
; build to releases/v<version>/.
extra_scripts = pre:scripts/fw_version.py
build_flags =
  -std=gnu++17
  -I lib/packet
  -I lib/gateway_state
build_unflags = -std=gnu++11
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

; ---- Current version: firmware/v0.5.4 ----
; v0.4.0+ carry their own packet format / gateway state in firmware/vX/protocol,
; so the shared lib/packet and lib/gateway_state (v1) are ignored there.
; The role is chosen at build time (no MODE pin since v0.5.3):
;   pio run -e gateway -t upload      gateway (2 radios, ThingsBoard, Wi-Fi)
;   pio run -e node -t upload         node; set NODE_ID (1..50) per board
[v0_5_4]
custom_fw_version = 0.5.4
; Fast upload (FT232R handles 921600); sandbox/flash-gateway.ps1 retries at
; 115200 if a long or loose cable fails.
upload_speed = 921600
; Monitor: timestamps, echo typed commands, keep a copy in logs/serial-*.log
monitor_filters = time, log2file
monitor_echo = yes
monitor_eol = LF
lib_ignore =
  packet
  gateway_state
lib_deps =
  ${env.lib_deps}
  olikraus/U8g2@^2.36.2
build_flags =
  -std=gnu++17
  -I firmware/v0.5.4/protocol
  -I firmware/v0.5.4/common
  -I firmware/v0.5.4/include
  ; main.cpp reads Serial and passes '#' lines to the Wi-Fi module
  -DWIFI_NVS_SERIAL_CMDS=0
build_src_filter =
  +<../firmware/v0.5.4/src/main.cpp>
  +<../firmware/v0.5.4/src/thingsboard_bridge.cpp>
  +<../firmware/v0.5.4/src/wifi_nvs.cpp>
  +<../firmware/v0.5.4/src/node_cloud.cpp>
  +<../firmware/v0.5.4/src/net_log.cpp>
  +<../firmware/v0.5.4/src/field_web.cpp>
  +<../firmware/v0.5.4/src/status_led.cpp>
  +<../firmware/v0.5.4/src/field_oled.cpp>
  +<../firmware/v0.5.4/protocol/packet.cpp>
  +<../firmware/v0.5.4/protocol/gateway_state.cpp>

[env:gateway]
extends = v0_5_4
build_flags =
  ${v0_5_4.build_flags}
  -DHYBRID_ROLE_GATEWAY=1

[env:node]
extends = v0_5_4
build_flags =
  ${v0_5_4.build_flags}
  -DHYBRID_ROLE_GATEWAY=0
  -DNODE_ID=1

; Field test builds: no Serial command and no reset needed.
;   gateway-test: only listens from power-up (QUIET), still logs to ThingsBoard.
;   node-test:    sends test STATUS back to back (continuous, ~0.6 per s) at
;                 17 dBm from power-up. Field tests only: it occupies the channel.
[env:gateway-test]
extends = v0_5_4
build_flags =
  ${v0_5_4.build_flags}
  -DHYBRID_ROLE_GATEWAY=1
  -DFIELD_TEST=1

[env:node-test]
extends = v0_5_4
build_flags =
  ${v0_5_4.build_flags}
  -DHYBRID_ROLE_GATEWAY=0
  -DNODE_ID=1
  -DFIELD_TEST=1

; ---- Older versions (frozen source; env names cannot contain dots) ----
; v0.1.0 has no env because its source does not compile (fixed in v0.2.0).
; v0.5.3: SF12 / 125 kHz, gateway role (node: -DHYBRID_ROLE_GATEWAY=0 -DNODE_ID=n).
[env:esp32dev-v0_5_3]
custom_fw_version = 0.5.3
lib_ignore =
  packet
  gateway_state
build_flags =
  -std=gnu++17
  -I firmware/v0.5.3/protocol
  -I firmware/v0.5.3/common
  -I firmware/v0.5.3/include
  -DWIFI_NVS_SERIAL_CMDS=0
  -DHYBRID_ROLE_GATEWAY=1
