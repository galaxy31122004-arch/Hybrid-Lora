[platformio]
; esp32dev always builds the current version (newest folder under firmware/).
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; scripts/fw_version.py turns custom_fw_version into FW_VERSION and copies each
; build to releases/v<version>/.
extra_scripts = pre:scripts/fw_version.py
build_flags =
  -std=gnu++17
  -I lib/packet
  -I lib/gateway_state
build_unflags = -std=gnu++11
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

; ---- Current version: firmware/v0.5.0 ----
; v0.4.0+ carry their own packet format / gateway state in firmware/vX/protocol,
; so the shared lib/packet and lib/gateway_state (v1) are ignored there.
[env:esp32dev]
custom_fw_version = 0.5.0
lib_ignore =
  packet
  gateway_state
build_flags =
  -std=gnu++17
  -I firmware/v0.5.0/protocol
  -I firmware/v0.5.0/common
build_src_filter =
  +<../firmware/v0.5.0/src/main.cpp>
  +<../firmware/v0.5.0/src/thingsboard_bridge.cpp>
  +<../firmware/v0.5.0/protocol/packet.cpp>
  +<../firmware/v0.5.0/protocol/gateway_state.cpp>

; ---- Older versions (frozen source; env names cannot contain dots) ----
; v0.1.0 has no env because its source does not compile (fixed in v0.2.0).
[env:esp32dev-v0_4_0]
custom_fw_version = 0.4.0
lib_ignore =
  packet
  gateway_state
build_flags =
  -std=gnu++17
  -I firmware/v0.4.0/protocol
  -I firmware/v0.4.0/common
build_src_filter =
  +<../firmware/v0.4.0/src/main.cpp>
  +<../firmware/v0.4.0/src/thingsboard_bridge.cpp>
  +<../firmware/v0.4.0/protocol/packet.cpp>
  +<../firmware/v0.4.0/protocol/gateway_state.cpp>

[env:esp32dev-v0_3_0]
custom_fw_version = 0.3.0
build_flags =
  ${env.build_flags}
  -I firmware/v0.3.0/common
build_src_filter =
  +<../firmware/v0.3.0/src/main.cpp>
  +<../firmware/v0.3.0/src/thingsboard_bridge.cpp>

[env:esp32dev-v0_2_0]
custom_fw_version = 0.2.0
build_flags =
  ${env.build_flags}
  -I firmware/v0.2.0/common
build_src_filter =
  +<../firmware/v0.2.0/src/main.cpp>
  +<../firmware/v0.2.0/src/thingsboard_bridge.cpp>
