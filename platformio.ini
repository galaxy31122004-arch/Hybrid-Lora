[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -I firmware/common
  -I lib/packet
  -I lib/gateway_state
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

[env:esp32dev]
build_src_filter = +<../firmware/src/main.cpp> +<../firmware/src/thingsboard_bridge.cpp>
